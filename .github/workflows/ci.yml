name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android · core tests + app build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: { working-directory: android }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK unit tests (pure JVM)
        run: ./gradlew :core:test --no-daemon --stacktrace
      - name: Compose app (debug)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-core-test-report
          path: android/core/build/reports/tests/test
          if-no-files-found: ignore
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: easyesuite-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS · kit tests + app build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Kit unit tests (SwiftPM, macOS)
        id: kittests
        continue-on-error: true
        working-directory: ios/EasyEsuiteKit
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: |
          xcodegen generate
          head -5 EasyEsuite.xcodeproj/project.pbxproj
      - name: Build app for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project EasyEsuite.xcodeproj \
            -scheme EasyEsuite \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee ../xcodebuild.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ../xcodebuild.log
      - name: Kit tests result
        if: steps.kittests.outcome == 'failure'
        run: echo "::error::EasyEsuiteKit unit tests failed (see 'Kit unit tests' step)"; exit 1
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: xcodebuild.log
          if-no-files-found: ignore
