name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android · core tests + app build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: { working-directory: android }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK unit tests (pure JVM)
        run: ./gradlew :core:test --no-daemon --stacktrace
      - name: Compose app (debug)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-core-test-report
          path: android/core/build/reports/tests/test
          if-no-files-found: ignore
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: easyesuite-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS · kit tests + app build
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app && xcodebuild -version && swift --version
      - name: Kit unit tests (SwiftPM, macOS)
        working-directory: ios/EasyEsuiteKit
        run: swift test 2>&1 | tee ../../kit-test.log | tail -40
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build app for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project EasyEsuite.xcodeproj \
            -scheme EasyEsuite \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee ../xcodebuild.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ../xcodebuild.log
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            kit-test.log
            xcodebuild.log
          if-no-files-found: ignore
