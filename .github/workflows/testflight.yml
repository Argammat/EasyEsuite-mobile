name: TestFlight

# Archives the iOS app, signs it with the team's Apple Distribution certificate and uploads it to
# App Store Connect (TestFlight). One-time setup: docs/TESTFLIGHT.md (run ios/scripts/asc-bootstrap.py,
# add the secrets it prints). Then: Actions → TestFlight → Run workflow, or push a tag like ios-v0.1.0.

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Version shown in TestFlight, e.g. 0.1.0 (blank = MARKETING_VERSION in ios/project.yml)"
        required: false
        default: ""
  push:
    tags: ["ios-v*"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive · sign · upload
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PROFILE_NAME: EasyEsuite Mobile App Store
      KEYCHAIN: ${{ runner.temp }}/testflight.keychain-db
      KEYCHAIN_PASSWORD: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8 DIST_CERT_P12_BASE64 DIST_CERT_PASSWORD PROVISIONING_PROFILE_BASE64; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — run ios/scripts/asc-bootstrap.py and add them (docs/TESTFLIGHT.md)"
            exit 1
          fi

      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          KEY="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_API_KEY_P8" > "$KEY"
          else
            printf '%s' "$ASC_API_KEY_P8" | base64 --decode > "$KEY"   # secret stored base64-encoded
          fi
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Install signing certificate and provisioning profile
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Apple's intermediate CAs — a fresh runner does not have them, and without them the identity is "not trusted"
          for g in G3 G4 G5 G6; do
            curl -sSfo "$RUNNER_TEMP/wwdr$g.cer" "https://www.apple.com/certificateauthority/AppleWWDRCA$g.cer" \
              && security import "$RUNNER_TEMP/wwdr$g.cer" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security >/dev/null || true
          done
          printf '%s' "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "Signing identities:"; security find-identity -v -p codesigning "$KEYCHAIN"
          # Provisioning profile → both locations Xcode looks in
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$RUNNER_TEMP/profile.mobileprovision" "$d/$UUID.mobileprovision"
          done
          echo "Installed profile '$NAME' ($UUID)"
          [ "$NAME" = "$PROFILE_NAME" ] || { echo "::error::Profile is named '$NAME' but ExportOptions.plist expects '$PROFILE_NAME'"; exit 1; }
          rm -f "$RUNNER_TEMP/dist.p12"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Version
        id: ver
        working-directory: ios
        run: |
          MV="${{ github.event.inputs.marketing_version }}"
          if [ -z "$MV" ] && [[ "${GITHUB_REF_NAME}" == ios-v* ]]; then MV="${GITHUB_REF_NAME#ios-v}"; fi
          if [ -z "$MV" ]; then MV=$(sed -n 's/.*MARKETING_VERSION: *"\([^"]*\)".*/\1/p' project.yml | head -1); fi
          BUILD=$GITHUB_RUN_NUMBER     # monotonic per workflow — every upload gets a new build number
          echo "marketing=$MV" >> "$GITHUB_OUTPUT"; echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Version $MV ($BUILD)"

      - name: Archive (Release, manual signing)
        working-directory: ios
        env:
          EASYESUITE_API_ROOT: ${{ vars.EASYESUITE_API_ROOT }}
          EASYESUITE_FIREBASE_API_KEY: ${{ secrets.EASYESUITE_FIREBASE_API_KEY }}
          EASYESUITE_FIREBASE_TENANT_ID: ${{ vars.EASYESUITE_FIREBASE_TENANT_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project EasyEsuite.xcodeproj -scheme EasyEsuite -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EasyEsuite.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            MARKETING_VERSION="${{ steps.ver.outputs.marketing }}" CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            EASYESUITE_API_ROOT="$EASYESUITE_API_ROOT" EASYESUITE_FIREBASE_API_KEY="$EASYESUITE_FIREBASE_API_KEY" EASYESUITE_FIREBASE_TENANT_ID="$EASYESUITE_FIREBASE_TENANT_ID" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|Signing Identity|Provisioning Profile|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"

      - name: Upload to App Store Connect
        working-directory: ios
        run: |
          set -o pipefail
          plutil -replace teamID -string "$APPLE_TEAM_ID" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/EasyEsuite.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log" | grep -E "error:|Upload|upload|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" "$RUNNER_TEMP/export.log"
          {
            echo "### TestFlight upload ✅"
            echo
            echo "EasyEsuite **${{ steps.ver.outputs.marketing }} (${{ steps.ver.outputs.build }})** was uploaded to App Store Connect."
            echo "Processing takes 10–30 minutes; it then appears under TestFlight → iOS builds (internal testers get it automatically)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and dSYMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-run-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/export/*.plist
            ${{ runner.temp }}/EasyEsuite.xcarchive/dSYMs
          if-no-files-found: ignore

      - name: Remove keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true
